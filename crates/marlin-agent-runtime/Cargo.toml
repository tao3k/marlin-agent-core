[package]
license.workspace = true
name = "marlin-agent-runtime"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aho-corasick.workspace = true
globset.workspace = true
libc.workspace = true
marlin-agent-environment.workspace = true
marlin-agent-graph.workspace = true
marlin-agent-protocol.workspace = true
marlin-agent-sessions.workspace = true
parking_lot.workspace = true
process-wrap = { version = "9.1.0", features = ["tokio1"] }
ring = "0.17.14"
semver = "1.0"
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.39.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
marlin-rust-project-harness-policy = { path = "../../build-support/marlin-rust-project-harness-policy" }
marlin-agent-harness-types.workspace = true
marlin-agent-test-support.workspace = true
tempfile.workspace = true

[[bench]]
name = "model_tool_catalog"
harness = false

[[bench]]
name = "runtime_events"
harness = false

[[test]]
name = "policy"
path = "tests/unit/policy.rs"
