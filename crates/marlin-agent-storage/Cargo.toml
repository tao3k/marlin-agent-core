[package]
license.workspace = true
name = "marlin-agent-storage"
version = "0.1.0"
edition = "2024"
authors = ["marlin contributors"]
repository = "https://github.com/tao3k/marlin-agent-core"
publish = false

[dependencies]
mrr-data-backend = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
turso = ["dep:mrr-data-backend", "mrr-data-backend/turso", "dep:serde_json", "dep:tokio"]
turso-sync = ["turso", "mrr-data-backend/turso-sync"]

[dev-dependencies]
asp-rust.workspace = true
marlin-agent-protocol.workspace = true
marlin-agent-sessions = { workspace = true }
marlin-agent-context = { workspace = true, features = ["org-memory"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
