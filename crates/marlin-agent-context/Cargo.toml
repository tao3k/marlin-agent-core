[package]
license.workspace = true
name = "marlin-agent-context"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.org"

[features]
# Typed values and linked Context entry points; no package loader.
gerbil-scheme-abi = ["dep:gerbil-scheme"]
# Package-host Context operations include the typed ABI.
gerbil = ["gerbil-scheme-abi"]
artifacts-abi = ["gerbil-scheme-abi", "dep:marlin-agent-gitops", "dep:sha2", "dep:tempfile"]
artifacts = ["artifacts-abi", "gerbil"]
org-source = [
    "dep:marlin-gerbil-ir",
    "dep:marlin-context-org-model",
    "dep:marlin-workspace",
    "dep:serde",
    "dep:serde_json",
]
org-workflow = ["org-source"]
org-memory = [
    "org-source",
    "dep:marlin-agent-graph",
    "dep:parking_lot",
    "dep:sha2",
]

[dependencies]
marlin-agent-graph = { workspace = true, optional = true }
marlin-gerbil-ir = { workspace = true, optional = true }
marlin-context-org-model = { workspace = true, optional = true }
marlin-workspace = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
gerbil-scheme = { workspace = true, optional = true }
marlin-agent-protocol.workspace = true
marlin-agent-gitops = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
marlin-context-org-model.workspace = true
criterion.workspace = true
tokio.workspace = true

[[bench]]
name = "scope_batch"
harness = false

[[test]]
name = "artifacts_workspace"
path = "tests/integration/artifacts_workspace.rs"

[[test]]
name = "batch"
path = "tests/unit/batch.rs"

[[test]]
name = "org_context_query"
path = "tests/integration/org_context_query.rs"

[[test]]
name = "org_scheme_vm"
path = "tests/integration/org_scheme_vm.rs"

[[test]]
name = "org_store_test"
path = "tests/unit/org_store_test.rs"

[[test]]
name = "org_workflow_test"
path = "tests/unit/org_workflow_test.rs"

[[test]]
name = "governance_async_mediation"
path = "tests/unit/governance_async_mediation.rs"

[[test]]
name = "governed_context_bridge"
path = "tests/unit/governed_context_bridge.rs"
required-features = ["org-memory"]
