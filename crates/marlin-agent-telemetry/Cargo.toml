[package]
name = "marlin-agent-telemetry"
license.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[[test]]
name = "policy"
path = "tests/unit/policy.rs"

[dependencies]
http = "1"
marlin-agent-protocol.workspace = true
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
marlin-rust-project-harness-policy = { path = "../../build-support/marlin-rust-project-harness-policy" }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
