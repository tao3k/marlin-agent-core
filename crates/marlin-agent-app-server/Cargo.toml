[package]
name = "marlin-agent-app-server"
license.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.org"

[features]
default = []
client = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]
grpc = [
    "client",
    "dep:async-stream",
    "dep:marlin-agent-kernel",
    "dep:marlin-agent-protocol",
    "dep:marlin-agent-runtime",
    "dep:marlin-agent-sessions",
    "dep:marlin-agent-storage",
    "dep:marlin-agent-stream",
    "dep:tokio",
    "dep:tokio-stream",
    "tonic/router",
    "tonic/server",
]
ui-grpc = [
    "grpc",
    "dep:agent-semantic-search",
    "dep:marlin-agent-gitops",
    "dep:serde",
    "dep:toml",
    "dep:weaver-llm",
]
turso-host = ["ui-grpc", "marlin-agent-storage/turso"]

[dependencies]
agent-semantic-search = { workspace = true, optional = true }
async-stream = { version = "0.3.6", optional = true }
marlin-agent-gitops = { workspace = true, optional = true }
marlin-agent-kernel = { workspace = true, optional = true }
marlin-agent-protocol = { workspace = true, optional = true }
marlin-agent-runtime = { workspace = true, optional = true }
marlin-agent-sessions = { workspace = true, optional = true }
marlin-agent-storage = { workspace = true, optional = true }
marlin-agent-stream = { workspace = true, optional = true }
prost = { version = "=0.14.4", optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen", "tls-aws-lc"], optional = true }
tonic-prost = { version = "=0.14.9", optional = true }
weaver-llm = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { version = "=0.14.6", optional = true }

[dev-dependencies]
asp-rust.workspace = true
marlin-agent-storage = { workspace = true, features = ["turso"] }
tempfile.workspace = true
tokio-stream = { workspace = true, features = ["net"] }

[[test]]
name = "unit_test"
path = "tests/unit_test.rs"

[[test]]
name = "grpc"
path = "tests/integration/grpc.rs"

[[test]]
name = "session"
path = "tests/integration/session/main.rs"

[[test]]
name = "ui_grpc"
path = "tests/integration/ui_grpc.rs"
required-features = ["ui-grpc"]

[[test]]
name = "ui_grpc_stability"
path = "tests/integration/ui_grpc_stability.rs"
required-features = ["ui-grpc"]

[[bin]]
name = "marlin-mygo-host"
path = "src/bin/marlin_mygo_host.rs"
required-features = ["ui-grpc"]

[[bin]]
name = "marlin-scheme-ctl"
path = "src/bin/marlin_scheme_ctl.rs"
required-features = ["ui-grpc"]

[[example]]
name = "mygo_bridge_server"
path = "examples/mygo_bridge_server.rs"
required-features = ["ui-grpc"]
