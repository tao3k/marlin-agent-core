syntax = "proto3";

package marlin.app.v1;

service AppServer {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // A request carries the transcript for a single stateless text turn.
  rpc StreamTurn(StreamTurnRequest) returns (stream TurnEvent);
  rpc StartSessionTurn(StartSessionTurnRequest) returns (StartSessionTurnResponse);
  rpc WatchSessionTurn(WatchSessionTurnRequest) returns (stream SessionTurnEvent);
  rpc CancelSessionTurn(CancelSessionTurnRequest) returns (CancelSessionTurnResponse);
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (GetSessionSummaryResponse);
  rpc GetSessionTurnStatus(GetSessionTurnStatusRequest) returns (GetSessionTurnStatusResponse);
  rpc GetSessionTurnCancellation(GetSessionTurnCancellationRequest) returns (GetSessionTurnCancellationResponse);

  // Session-free GraphEngine TaskActor control plane (MAR-GRAPH-R01..R06).
  rpc RegisterTaskActor(RegisterTaskActorRequest) returns (TaskActorCursorResponse);
  rpc DispatchTaskActor(DispatchTaskActorRequest) returns (DispatchTaskActorResponse);
  rpc ReconcileTaskReceipt(ReconcileTaskReceiptRequest) returns (ReconcileTaskReceiptResponse);
  rpc BindGovernedContext(BindGovernedContextRequest) returns (BindGovernedContextResponse);
  rpc GetWorkbenchTabs(GetWorkbenchTabsRequest) returns (WorkbenchTabsResponse);
  rpc WatchWorkbenchTabs(WatchWorkbenchTabsRequest) returns (stream WorkbenchTabsResponse);
}

// The host owns Session admission and Runtime allocation. Reopen must resolve
// an existing Session in the caller's authorized scope.
message OpenSessionRequest {
  string session_id = 1;
  SessionOpenMode mode = 2;
}

enum SessionOpenMode {
  SESSION_OPEN_MODE_UNSPECIFIED = 0;
  SESSION_OPEN_MODE_CREATE = 1;
  SESSION_OPEN_MODE_EXISTING = 2;
}

message OpenSessionResponse {
  string session_id = 1;
}

message GetSessionSummaryRequest {
  string session_id = 1;
}

message GetSessionSummaryResponse {
  // Absent when the Session has no committed turns.
  SessionTurnRef latest_turn = 1;
  // Journal position represented by the summary, independent of the client's applied cursor.
  optional string latest_event_id = 2;
  SessionRecoveryState recovery_state = 3;
}

enum SessionRecoveryState {
  SESSION_RECOVERY_STATE_UNSPECIFIED = 0;
  SESSION_RECOVERY_STATE_EMPTY = 1;
  SESSION_RECOVERY_STATE_ACTIVE = 2;
  SESSION_RECOVERY_STATE_FINISHED = 3;
  SESSION_RECOVERY_STATE_UNRESOLVED = 4;
  SESSION_RECOVERY_STATE_TOOL_CONTINUATION_PENDING = 5;
}

message GetSessionTurnStatusRequest {
  SessionTurnRef turn = 1;
}

message GetSessionTurnStatusResponse {
  SessionTurnRef turn = 1;
  // ACTIVE, FINISHED or UNRESOLVED. A missing turn returns NOT_FOUND.
  SessionRecoveryState recovery_state = 2;
  // Observed journal position. Watch still resumes from the client's applied cursor.
  string latest_event_id = 3;
  // Present only when the journal has an outcome for the observed turn.
  optional SessionTurnOutcome outcome = 4;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  uint32 max_request_bytes = 1;
  uint32 max_messages = 2;
  uint32 max_output_text_bytes = 3;
  optional string session_id = 4;
}

message StreamTurnRequest {
  repeated ConversationMessage messages = 1;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

message ConversationMessage {
  MessageRole role = 1;
  string text = 2;
}

message TurnEvent {
  oneof event {
    TurnStarted started = 1;
    TextDelta text_delta = 2;
    TurnCompleted completed = 3;
  }
}

message TurnStarted {}

message TextDelta {
  // One-based sequence within this turn.
  uint64 sequence = 1;
  string text = 2;
}

// Completion describes the streamed text. It carries no session identity.
message TurnCompleted {
  uint64 text_chunks = 1;
  uint64 text_bytes = 2;
}

// The host binds the service instance to an existing project and Session.
message StartSessionTurnRequest {
  string session_id = 1;
  string user_text = 2;
  // Client's observed last turn ordinal. A stale ordinal refuses redispatch.
  uint64 after_turn = 3;
  // Required. Stable across retries of the exact user_text and after_turn.
  // 1-128 ASCII letters, digits, hyphens or underscores, scoped to this Session.
  // Reusing an ID with different input returns ALREADY_EXISTS.
  string submission_id = 4;
}

message SessionTurnRef {
  string session_id = 1;
  uint64 ordinal = 2;
}

message StartSessionTurnResponse {
  SessionTurnRef turn = 1;
}

message WatchSessionTurnRequest {
  SessionTurnRef turn = 1;
  // Exclusive journal event ID previously delivered for this same turn.
  optional string after_event_id = 2;
}

message SessionTurnEvent {
  string event_id = 1;
  oneof event {
    TurnStarted started = 2;
    TextCheckpoint text_checkpoint = 3;
    SessionTurnOutcome outcome = 4;
  }
}

message TextCheckpoint {
  string text = 1;
}

enum SessionTurnOutcome {
  SESSION_TURN_OUTCOME_UNSPECIFIED = 0;
  SESSION_TURN_OUTCOME_COMPLETED = 1;
  SESSION_TURN_OUTCOME_REJECTED_BEFORE_DISPATCH = 2;
  SESSION_TURN_OUTCOME_REMOTE_UNCERTAIN = 3;
}

message CancelSessionTurnRequest {
  SessionTurnRef turn = 1;
}

// Projection of Marlin's RuntimeTaskShutdownReceipt for this turn's local task scope.
message RuntimeShutdownReceipt {
  bool completed = 1;
  bool cancellation_requested = 2;
  bool tracker_closed = 3;
  uint64 tracked_tasks_at_shutdown = 4;
  uint64 remaining_tasks = 5;
  optional uint64 timeout_ms = 6;
  RuntimeRetirementStatus status = 7;
}

enum RuntimeRetirementStatus {
  RUNTIME_RETIREMENT_STATUS_UNSPECIFIED = 0;
  RUNTIME_RETIREMENT_STATUS_COMPLETED = 1;
  RUNTIME_RETIREMENT_STATUS_TIMED_OUT = 2;
  RUNTIME_RETIREMENT_STATUS_CLEANUP_UNCONFIRMED = 3;
}

message CancelSessionTurnResponse {
  SessionTurnRef turn = 1;
  RuntimeShutdownReceipt runtime = 2;
  SessionTurnOutcome outcome = 3;
}

message GetSessionTurnCancellationRequest {
  SessionTurnRef turn = 1;
}

message GetSessionTurnCancellationResponse {
  SessionTurnRef turn = 1;
  oneof evidence {
    RuntimeShutdownReceipt recorded = 2;
    CancellationEvidenceUnavailable unavailable = 3;
  }
  SessionTurnOutcome outcome = 4;
}

message CancellationEvidenceUnavailable {}

// Session-free TaskActor & GovernedContext control-plane wire types.

enum TaskActorScopeModeProto {
  TASK_ACTOR_SCOPE_MODE_PROTO_UNSPECIFIED = 0;
  TASK_ACTOR_SCOPE_MODE_PROTO_PROJECT = 1;
  TASK_ACTOR_SCOPE_MODE_PROTO_DETACHED = 2;
}

enum TaskActorStatusProto {
  TASK_ACTOR_STATUS_PROTO_UNSPECIFIED = 0;
  TASK_ACTOR_STATUS_PROTO_OPEN_FOCUS = 1;
  TASK_ACTOR_STATUS_PROTO_RUNNING = 2;
  TASK_ACTOR_STATUS_PROTO_WAITING_STEERING = 3;
  TASK_ACTOR_STATUS_PROTO_SETTLED = 4;
  TASK_ACTOR_STATUS_PROTO_FAILED = 5;
  TASK_ACTOR_STATUS_PROTO_ABORTED = 6;
}

enum GraphDispatchOperationProto {
  GRAPH_DISPATCH_OPERATION_PROTO_UNSPECIFIED = 0;
  GRAPH_DISPATCH_OPERATION_PROTO_EXECUTE_FRONTIER = 1;
  GRAPH_DISPATCH_OPERATION_PROTO_APPLY_STEERING = 2;
  GRAPH_DISPATCH_OPERATION_PROTO_CONVERGE_APEX = 3;
  GRAPH_DISPATCH_OPERATION_PROTO_COMMIT_SETTLEMENT = 4;
}

enum GraphSubstrateTargetProto {
  GRAPH_SUBSTRATE_TARGET_PROTO_UNSPECIFIED = 0;
  GRAPH_SUBSTRATE_TARGET_PROTO_PURE_MEMORY = 1;
  GRAPH_SUBSTRATE_TARGET_PROTO_SQLITE_TURSO = 2;
}

enum ExecutionReceiptStatusProto {
  EXECUTION_RECEIPT_STATUS_PROTO_UNSPECIFIED = 0;
  EXECUTION_RECEIPT_STATUS_PROTO_OK = 1;
  EXECUTION_RECEIPT_STATUS_PROTO_SETTLED = 2;
  EXECUTION_RECEIPT_STATUS_PROTO_FAILED = 3;
  EXECUTION_RECEIPT_STATUS_PROTO_REJECTED = 4;
}

enum DisclosureDepthProto {
  DISCLOSURE_DEPTH_PROTO_UNSPECIFIED = 0;
  DISCLOSURE_DEPTH_PROTO_L0 = 1;
  DISCLOSURE_DEPTH_PROTO_L1 = 2;
  DISCLOSURE_DEPTH_PROTO_L2 = 3;
  DISCLOSURE_DEPTH_PROTO_L3 = 4;
}

enum DetourModeProto {
  DETOUR_MODE_PROTO_UNSPECIFIED = 0;
  DETOUR_MODE_PROTO_MAINLINE = 1;
  DETOUR_MODE_PROTO_BLOCKER_ACTIVE = 2;
  DETOUR_MODE_PROTO_SIDE_QUEST_ACTIVE = 3;
}

enum WorkbenchTabKindProto {
  WORKBENCH_TAB_KIND_PROTO_UNSPECIFIED = 0;
  WORKBENCH_TAB_KIND_PROTO_PINNED_INDEX = 1;
  WORKBENCH_TAB_KIND_PROTO_ACTIVE_TASK = 2;
  WORKBENCH_TAB_KIND_PROTO_READ_ONLY_PEEK = 3;
}

message TaskActorCursorProto {
  string task_id = 1;
  uint64 fencing_epoch = 2;
  TaskActorStatusProto status = 3;
  TaskActorScopeModeProto scope_mode = 4;
  uint32 pending_steering_branches = 5;
}

message RegisterTaskActorRequest {
  string task_id = 1;
  string title = 2;
  TaskActorScopeModeProto scope_mode = 3;
}

message TaskActorCursorResponse {
  TaskActorCursorProto cursor = 1;
}

message DispatchTaskActorRequest {
  string request_id = 1;
  string task_id = 2;
  uint64 fencing_epoch = 3;
  GraphDispatchOperationProto operation = 4;
  GraphSubstrateTargetProto substrate_target = 5;
  TaskActorScopeModeProto scope_mode = 6;
  optional string join_node_id = 7;
}

message DispatchTaskActorResponse {
  string request_id = 1;
  string task_id = 2;
  uint64 fencing_epoch = 3;
  GraphDispatchOperationProto operation = 4;
  GraphSubstrateTargetProto substrate_target = 5;
}

message ReconcileTaskReceiptRequest {
  string request_id = 1;
  string task_id = 2;
  uint64 fencing_epoch = 3;
  ExecutionReceiptStatusProto status = 4;
}

message ReconcileTaskReceiptResponse {
  bool accepted = 1;
  string reason = 2;
  uint64 next_epoch = 3;
  TaskActorStatusProto next_status = 4;
}

message BindGovernedContextRequest {
  string task_id = 1;
  uint64 context_cut = 2;
  string kv_prefix_digest = 3;
  DisclosureDepthProto disclosure_depth = 4;
  bool has_active_defeater = 5;
  uint32 quarantined_memory_count = 6;
  bool sandbox_admitted = 7;
  bool cedar_handoff_valid = 8;
  DetourModeProto detour_mode = 9;
  bool auto_archive_enabled = 10;
}

message BindGovernedContextResponse {
  string task_id = 1;
  uint64 context_cut = 2;
  DisclosureDepthProto disclosure_depth = 3;
  string kv_prefix_digest = 4;
  DetourModeProto detour_mode = 5;
  bool auto_archive_enabled = 6;
}

message GetWorkbenchTabsRequest {}

message WatchWorkbenchTabsRequest {}

message WorkbenchTabEntryProto {
  WorkbenchTabKindProto kind = 1;
  string id = 2;
  string title = 3;
  string status_label = 4;
  bool focused = 5;
  uint64 fencing_epoch = 6;
}

message WorkbenchTabsResponse {
  optional string focused_task_id = 1;
  repeated WorkbenchTabEntryProto tabs = 2;
}
