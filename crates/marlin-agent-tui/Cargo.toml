[package]
license.workspace = true
name = "marlin-agent-tui"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "marlin-tui"
path = "src/main.rs"

[features]
default = ["linked-ui"]
linked-ui = ["dep:gerbil-scheme-sys", "dep:gerbil-scheme-aot-build", "gerbil-scheme/external-program", "marlin-agent-ui/linked-ui"]

[dependencies]
async-stream = "0.3.6"
marlin-agent-protocol.workspace = true
marlin-agent-runtime.workspace = true
marlin-agent-sessions.workspace = true
marlin-agent-storage = { workspace = true, features = ["turso"] }
marlin-agent-stream = { path = "../marlin-agent-stream" }
marlin-agent-ui.workspace = true
marlin-git-utils.workspace = true
gerbil-scheme.workspace = true
gerbil-scheme-sys = { workspace = true, optional = true }
ratatui = { version = "=0.30.2", default-features = false, features = ["termion"] }
serde.workspace = true
serde_json.workspace = true
termion = "4.0.6"
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tower.workspace = true
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
weaver-llm.workspace = true

[build-dependencies]
gerbil-scheme-aot-build = { workspace = true, optional = true }

[dev-dependencies]
# `just rust-dev-gate` applies this shared ASP Rust policy to the TUI package.
marlin-rust-project-harness-policy = { path = "../../build-support/marlin-rust-project-harness-policy" }
proptest.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["unstable-rendered-line-info"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", features = ["process", "signal", "term"] }
rustix = { version = "=1.1.6", features = ["termios"] }
tempfile.workspace = true
turso = { version = "=0.8.3", default-features = false }
