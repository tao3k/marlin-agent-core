[package]
name = "marlin-deck-runtime"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.org"

[features]
default = []
actor-runtime = ["dep:marlin-agent-context", "marlin-agent-context/gerbil", "dep:gerbil-scheme", "dep:gerbil-scheme-sys", "dep:thiserror", "dep:tokio", "dep:tokio-util"]

[[bench]]
name = "single_vm_actor"
harness = false
required-features = ["actor-runtime"]

[dependencies]
gerbil-scheme = { workspace = true, optional = true, features = ["external-program"] }
gerbil-scheme-sys = { workspace = true, optional = true }
marlin-agent-context = { workspace = true, optional = true }
marlin-gerbil-scheme.workspace = true
serde.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[build-dependencies]
marlin-gerbil-aot-link.workspace = true

[dev-dependencies]
marlin-agent-protocol.workspace = true
