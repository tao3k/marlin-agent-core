[package]
name = "marlin-gerbil-scheme"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Gerbil Scheme runtime bindings for typed Marlin artifacts."
license.workspace = true
readme = "README.org"
publish = false

[features]
external-program = ["gerbil-scheme/external-program"]
app-server-host = [
    "dep:marlin-agent-app-server",
    "dep:marlin-agent-kernel",
    "dep:marlin-agent-storage",
    "dep:tokio",
]

[dependencies]
marlin-agent-app-server = { workspace = true, features = ["turso-host"], optional = true }
marlin-agent-kernel = { workspace = true, optional = true }
marlin-agent-storage = { workspace = true, features = ["turso"], optional = true }
tokio = { workspace = true, optional = true }
marlin-agent-harness-types.workspace = true
marlin-agent-protocol.workspace = true
marlin-agent-graph.workspace = true
marlin-gerbil-ir.workspace = true
marlin-agent-gitops.workspace = true
object.workspace = true
serde.workspace = true
serde_json.workspace = true
gerbil-scheme.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-executor.workspace = true
marlin-agent-kernel.workspace = true
marlin-agent-runtime.workspace = true
marlin-agent-storage = { workspace = true, features = ["turso"] }
marlin-agent-context = { workspace = true, features = ["org-memory", "org-workflow"] }
memoffset.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[[bin]]
name = "marlin-scheme-host"
path = "src/bin/marlin_scheme_host.rs"
required-features = ["app-server-host"]

[[bin]]
name = "marlin-app-server"
path = "src/bin/marlin_app_server.rs"
required-features = ["app-server-host"]

[[test]]
name = "graph_engine_vm"
path = "tests/graph_engine_vm.rs"
required-features = ["app-server-host"]

[[test]]
name = "scheme_host_process"
path = "tests/scheme_host_process.rs"
required-features = ["app-server-host"]
