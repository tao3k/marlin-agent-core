name: Linked native AOT gate

on:
  pull_request:
    paths:
      - ".github/workflows/linked-scheme-aot-gate.yaml"
      - "build-support/marlin-gerbil-aot-link/**"
      - "crates/marlin-deck-runtime/**"
      - "crates/marlin-agent-context/**"
      - "crates/marlin-gerbil-scheme/**"
      - "crates/marlin-gerbil-ir/**"
      - "crates/marlin-agent-policy-routing-abi/**"
      - "scheme/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      linked_native_runner:
        description: JSON runs-on labels, for example ["ubuntu-latest"], ["macos-latest"], or ["self-hosted","Linux"].
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_C_COMPILER: clang
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY }}
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR }}

jobs:
  linked-selector:
    name: Linked native AOT gate
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.linked_native_runner || '["ubuntu-latest"]') || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: marlin-agent-core-linked-selector-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - name: Install native compiler
        run: |
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y clang
              ;;
            macOS)
              clang --version
              ;;
            *)
              echo "::error::linked-selector gate requested on unsupported runner OS ${{ runner.os }}."
              exit 1
              ;;
          esac

      - uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@dfe8b62b5dc64de88f8d70a77059a1741218ef80
        with:
          release-root: ${{ runner.temp }}/gerbil

      - name: Check out AI Agentic Lab dependency tooling
        uses: actions/checkout@v6
        with:
          repository: tao3k/agentic-ai-lab
          ref: 75b04e07c6d5a2ff3fa73f2f47689a5947cd08d0
          path: .ci/agentic-ai-lab
          persist-credentials: false

      - name: Prepare the pinned Lab source
        working-directory: scheme
        run: gxpkg env gxi ../.ci/agentic-ai-lab/packages/automation/runtime-dependencies.ss --fetch-only

      - name: Prepare Lab's pinned dependencies
        working-directory: .ci/agentic-ai-lab
        env:
          GERBIL_PATH: ${{ github.workspace }}/scheme/.gerbil
        run: gxi packages/automation/runtime-dependencies.ss --fetch-only

      - name: Build the Cargo-selected Scheme Bridge
        env:
          GERBIL_PATH: ${{ github.workspace }}/scheme/.gerbil
        run: |
          set -euo pipefail
          bridge_root="$(
            cargo metadata --locked --format-version 1 |
              jq -er '
                [.packages[] | select(.name == "gerbil-scheme-build") | .manifest_path] |
                if length == 1 then
                  .[0] | sub("/crates/gerbil-scheme-build/Cargo.toml$"; "")
                else error("expected one Cargo-selected Scheme Bridge") end'
          )"
          cd "$bridge_root"
          gxi build.ss compile

      - name: Install the Scheme package dependency
        working-directory: scheme
        run: gxpkg deps --install

      - name: Compile linked-selector tests
        run: |
          cargo test --locked -p marlin-deck-runtime --features actor-runtime --no-run
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector --no-run

      - name: Run linked-selector tests
        run: |
          cargo test --locked -p marlin-deck-runtime --features actor-runtime
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector

      - name: Compile linked selector benchmarks
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor --no-run
          cargo bench --locked -p marlin-deck-runtime --features mailbox-benchmark --bench mailbox --bench context_profile --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape --no-run

      - name: Run linked native allocation scenario performance gate
        run: cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape

      - name: Benchmark linked selector
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 1 1024
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 64 1024
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector

      - name: Upload linked native benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linked-selector-criterion-${{ runner.os }}
          path: |
            target/criterion
            target/marlin/scenarios
          if-no-files-found: warn
