name: Linked native AOT gate

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      linked_native_runner:
        description: JSON runs-on labels, for example ["ubuntu-latest"], ["macos-latest"], or ["self-hosted","Linux"].
        required: false
        default: '["ubuntu-latest"]'
        type: string
      trace_dependency_crash:
        description: Inspect dependency crash dumps and replay the failed indexer's source order on GitHub-hosted Ubuntu.
        default: false
        type: boolean
      qualify_context_latency:
        description: Run the fixed four-process Context latency cohort on the selected runner.
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_C_COMPILER: clang
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY }}
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR }}

jobs:
  linked-selector:
    name: Linked native AOT gate
    runs-on: ${{ fromJSON(inputs.runner || inputs.linked_native_runner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linked-aot-${{ hashFiles('.github/actions/setup-scheme/action.yml', 'scheme/gerbil.pkg') }}

      - uses: ./.github/actions/restore-scheme
        if: inputs.artifact != ''
        with:
          artifact: ${{ inputs.artifact }}

      - uses: ./.github/actions/prepare-scheme
        if: inputs.artifact == ''
        with:
          trace-dependency-crash: ${{ inputs.trace_dependency_crash && inputs.linked_native_runner == '["ubuntu-latest"]' }}

      - name: Select the staged Scheme inputs for a manual run
        if: inputs.artifact == ''
        run: |
          prefix="$GITHUB_WORKSPACE/scheme/.gerbil"
          {
            echo "GERBIL_PATH=$prefix"
            echo "GERBIL_LOADPATH=$prefix/lib"
          } >> "$GITHUB_ENV"

      - name: Ensure the native compiler is available
        id: compiler
        run: |
          if [[ "$RUNNER_OS" == Linux ]] && ! command -v clang >/dev/null; then
            sudo apt-get install -y clang
          fi
          clang --version

      - name: Ensure Protobuf compiler is available
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if ! command -v protoc >/dev/null; then
            if [[ "$RUNNER_OS" == macOS ]]; then
              brew install protobuf
            else
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends protobuf-compiler
            fi
          fi
          protoc --version

      - name: Install Worktrunk for the worktree acceptance
        if: (runner.os == 'Linux' && runner.arch == 'X64') || (runner.os == 'macOS' && runner.arch == 'ARM64')
        id: worktrunk
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              target=x86_64-unknown-linux-musl
              digest=d1feb2c231e10030c5301ffdd539a48f37ebfec50dea6ef1e1078c87e95beeec
              ;;
            macOS-ARM64)
              target=aarch64-apple-darwin
              digest=fe9cb0714bd0e4cabc34564d5a39bad3040e8d2a55140d08e02564f14aea2962
              ;;
            *) exit 1 ;;
          esac
          archive="worktrunk-$target.tar.xz"
          url="https://github.com/max-sixty/worktrunk/releases/download/v0.58.0/$archive"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output "$archive" "$url"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check
          tar -xJf "$archive" "worktrunk-$target/wt"
          echo "$RUNNER_TEMP/worktrunk-$target" >> "$GITHUB_PATH"
      - name: Verify Scheme working-copy selection and Git receipts
        if: steps.worktrunk.outcome == 'success'
        run: >-
          cargo test --locked -p marlin-gerbil-scheme --test unit_test
          working_copy_policy::scheme_selects_the_provider_for_a_real_git_worktree
          -- --ignored --exact --nocapture

      - name: Compile linked-selector tests
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        id: linked-build
        run: |
          receipt="$RUNNER_TEMP/deck-test-build.jsonl"
          cargo test --locked -p marlin-deck-runtime --features actor-runtime --no-run \
            --message-format=json > "$receipt" || {
              result=$?
              jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' "$receipt" >&2
              exit "$result"
            }
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector --no-run

      - name: Run linked-selector tests
        if: ${{ !cancelled() && steps.linked-build.outcome == 'success' }}
        id: linked-tests
        run: |
          cargo test --locked -p marlin-deck-runtime --features actor-runtime
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector

      - name: Verify the Deck's deferred Scheme scopes
        if: ${{ !cancelled() && steps.linked-build.outcome == 'success' }}
        shell: bash
        run: |
          program_out=$(jq -ers '[.[] | select(.reason == "build-script-executed" and
            (.package_id | test("/marlin-deck-runtime#|#marlin-deck-runtime@"))) | .out_dir] |
            if length == 1 then .[0] else error("expected one Deck build receipt") end' "$RUNNER_TEMP/deck-test-build.jsonl")
          jq -e 'any(.modules[]; .module == "marlin-agent-core/deck-runtime/config" and .deferred == true) and
            any(.modules[]; .module == "marlin-agent-core/context-system/config" and .deferred == true) and
            all(.modules[]; .module != "marlin-agent-core/init")' "$program_out/program/linked-program.json"

      - name: Link the Interface-selected Brief-to-Draft program
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        id: brief-stage
        shell: bash
        run: |
          receipt=$(cargo test --locked -p marlin-agent-core --features brief-to-draft-vm-test \
            --test brief_to_draft_vm --no-run --message-format=json)
          program_out=$(jq -ers '[.[] | select(.reason == "build-script-executed" and
            (.package_id | test("/marlin-agent-core#|#marlin-agent-core@"))) | .out_dir] |
            if length == 1 then .[0] else error("expected one Brief-to-Draft build receipt") end' <<< "$receipt")
          jq -e 'any(.modules[]; .module == "marlin-agent-core/context-system/types" and .deferred == true) and
            any(.modules[]; .module == "marlin-agent-core/brief-to-draft/config" and .deferred == true)' \
            "$program_out/program/linked-program.json"

      - name: Verify Brief-to-Draft activation and offline replay
        if: ${{ !cancelled() && steps.brief-stage.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --locked -p marlin-agent-core --no-default-features \
            --test brief_to_draft_offline --no-run --message-format=json > "$RUNNER_TEMP/brief-offline-build.jsonl"
          verifier=$(jq -ser '[.[] | select(.reason == "compiler-artifact"
            and .target.name == "brief_to_draft_offline" and .executable != null) | .executable]
            | if length == 1 then .[0] else error("expected one offline verifier") end' "$RUNNER_TEMP/brief-offline-build.jsonl")
          MARLIN_BRIEF_OFFLINE_TEST="$verifier" cargo test --locked -p marlin-agent-core \
            --features brief-to-draft-vm-test --test brief_to_draft_vm

      - name: Verify Linked-AOT marlin-scheme-host-aot and marlin-scheme-ctl E2E
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --locked -p marlin-gerbil-aot-link
          PROTOC=/nonexistent cargo test --locked -p marlin-gerbil-scheme --test unit_test dependency_boundary::
          cargo test --locked -p marlin-gerbil-scheme --features app-server-host --lib scheme_host_runtime::tests
          cargo test --locked -p marlin-agent-app-server --features ui-grpc --lib scheme_host_client::tests
          cargo test --locked -p marlin-agent-app-server --features ui-grpc --bin marlin-scheme-ctl
          cargo build --locked -p marlin-agent-app-server --features ui-grpc --bin marlin-scheme-ctl
          MARLIN_SCHEME_CTL_BIN="$PWD/target/debug/marlin-scheme-ctl" \
            cargo test --locked -p marlin-agent-core --features linked-scheme-host \
              --test scheme_host_aot_process -- --test-threads=1 --nocapture

      - name: Verify Governance Authority Plane (Kernel Cedar/MGV1/MGF1 + Live Gambit VM + Linked-AOT)
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --locked -p marlin-agent-kernel --lib governance_cedar
          cargo test --locked -p marlin-agent-kernel --lib governance_admission
          cargo test --locked -p marlin-agent-kernel --test unit_test loop_program_side_effects
          cargo test --locked -p marlin-gerbil-scheme --features app-server-host --lib governance_host
          cargo test --locked -p marlin-gerbil-scheme --test governance_policy_vm
          cargo build --locked -p marlin-agent-core --features linked-scheme-host --bin marlin-scheme-host-aot

      - name: Compile linked selector benchmarks
        if: ${{ !cancelled() && steps.linked-tests.outcome == 'success' }}
        id: benchmark-build
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor --no-run
          cargo bench --locked -p marlin-deck-runtime --features mailbox-benchmark --bench mailbox --bench context_profile --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape --no-run

      - name: Run linked native allocation scenario performance gate
        if: ${{ !cancelled() && steps.benchmark-build.outcome == 'success' }}
        run: cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape

      - name: Benchmark linked selector
        if: ${{ !cancelled() && steps.benchmark-build.outcome == 'success' }}
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 1 1024
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 64 1024
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        if: ${{ !cancelled() && inputs.qualify_context_latency && steps.linked-tests.outcome == 'success' }}
        id: just
        with:
          tool: just@1.56.0
      - name: Qualify full Context latency
        if: ${{ !cancelled() && steps.just.outcome == 'success' }}
        run: just context-latency-gate

      - name: Upload linked native benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linked-selector-criterion-${{ runner.os }}
          path: |
            target/criterion
            target/marlin/scenarios
            target/context-cohort.*
          if-no-files-found: warn
