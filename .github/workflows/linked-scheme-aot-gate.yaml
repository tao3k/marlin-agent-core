name: Linked native AOT gate

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      linked_native_runner:
        description: JSON runs-on labels, for example ["ubuntu-latest"], ["macos-latest"], or ["self-hosted","Linux"].
        required: false
        default: '["ubuntu-latest"]'
        type: string
      trace_dependency_crash:
        description: Inspect dependency crash dumps and test the compiled Org grammar import on GitHub-hosted Ubuntu.
        default: false
        type: boolean
      qualify_context_latency:
        description: Run the fixed four-process Context latency cohort on the selected runner.
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_C_COMPILER: clang
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_LIBRARY }}
  MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR: ${{ vars.MARLIN_AGENT_POLICY_ROUTING_NATIVE_GAMBIT_LINK_SEARCH_DIR }}

jobs:
  linked-selector:
    name: Linked native AOT gate
    runs-on: ${{ fromJSON(inputs.runner || inputs.linked_native_runner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linked-aot-${{ hashFiles('.github/actions/setup-scheme/action.yml', 'scheme/gerbil.pkg') }}

      - uses: ./.github/actions/restore-scheme
        if: inputs.artifact != ''
        with:
          artifact: ${{ inputs.artifact }}

      - uses: ./.github/actions/prepare-scheme
        if: inputs.artifact == ''
        with:
          trace-dependency-crash: ${{ inputs.trace_dependency_crash && inputs.linked_native_runner == '["ubuntu-latest"]' }}

      - name: Select the staged Scheme inputs for a manual run
        if: inputs.artifact == ''
        run: |
          prefix="$GITHUB_WORKSPACE/scheme/.gerbil"
          {
            echo "GERBIL_PATH=$prefix"
            echo "GERBIL_LOADPATH=$prefix/lib"
          } >> "$GITHUB_ENV"

      - name: Ensure the native compiler is available
        run: |
          if [[ "$RUNNER_OS" == Linux ]] && ! command -v clang >/dev/null; then
            sudo apt-get install -y clang
          fi
          clang --version

      - name: Install Worktrunk for the worktree acceptance
        if: (runner.os == 'Linux' && runner.arch == 'X64') || (runner.os == 'macOS' && runner.arch == 'ARM64')
        id: worktrunk
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              target=x86_64-unknown-linux-musl
              digest=d1feb2c231e10030c5301ffdd539a48f37ebfec50dea6ef1e1078c87e95beeec
              ;;
            macOS-ARM64)
              target=aarch64-apple-darwin
              digest=fe9cb0714bd0e4cabc34564d5a39bad3040e8d2a55140d08e02564f14aea2962
              ;;
            *) exit 1 ;;
          esac
          archive="worktrunk-$target.tar.xz"
          url="https://github.com/max-sixty/worktrunk/releases/download/v0.58.0/$archive"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output "$archive" "$url"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check
          tar -xJf "$archive" "worktrunk-$target/wt"
          echo "$RUNNER_TEMP/worktrunk-$target" >> "$GITHUB_PATH"
      - name: Verify Scheme working-copy selection and Git receipts
        if: steps.worktrunk.outcome == 'success'
        env:
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ github.workspace }}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json
        run: >-
          cargo test --locked -p marlin-gerbil-scheme --test unit_test
          working_copy_policy::scheme_selects_the_provider_for_a_real_git_worktree
          -- --ignored --exact --nocapture

      - name: Compile linked-selector tests
        run: |
          cargo test --locked -p marlin-deck-runtime --features actor-runtime --no-run
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector --no-run

      - name: Run linked-selector tests
        run: |
          cargo test --locked -p marlin-deck-runtime --features actor-runtime
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector

      - name: Stage the Brief-to-Draft Scheme program
        working-directory: scheme
        shell: bash
        run: |
          bridge_manifest=$(cargo metadata --locked --format-version 1 |
            jq -er '.packages[] | select(.name == "gerbil-scheme-build") | .manifest_path')
          bridge_root=${bridge_manifest%/crates/gerbil-scheme-build/Cargo.toml}
          bridge_prefix="$RUNNER_TEMP/brief-to-draft-bridge"
          (cd "$bridge_root" && GERBIL_PATH="$bridge_prefix" gerbil build)
          test -s "$bridge_prefix/lib/gerbil-scheme-rust/scheme/program-build.ssi"
          export GERBIL_LOADPATH="$bridge_prefix/lib:$GERBIL_LOADPATH"
          gxi brief-to-draft-stage.ss
          jq -e 'any(.modules[]; .module == "marlin-agent-core/context/types" and .deferred == true) and
            any(.modules[]; .module == "marlin-agent-core/brief-to-draft/config" and .deferred == true)' \
            .gerbil/native/brief-to-draft/program.json

      - name: Verify Brief-to-Draft activation and offline replay
        env:
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ github.workspace }}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json
        shell: bash
        run: |
          cargo test --locked -p marlin-agent-core --no-default-features \
            --test brief_to_draft_offline --no-run --message-format=json > "$RUNNER_TEMP/brief-offline-build.jsonl"
          verifier=$(jq -ser '[.[] | select(.reason == "compiler-artifact"
            and .target.name == "brief_to_draft_offline" and .executable != null) | .executable]
            | if length == 1 then .[0] else error("expected one offline verifier") end' "$RUNNER_TEMP/brief-offline-build.jsonl")
          MARLIN_BRIEF_OFFLINE_TEST="$verifier" cargo test --locked -p marlin-agent-core \
            --features brief-to-draft-vm-test --test brief_to_draft_vm

      - name: Compile linked selector benchmarks
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor --no-run
          cargo bench --locked -p marlin-deck-runtime --features mailbox-benchmark --bench mailbox --bench context_profile --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector --no-run
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape --no-run

      - name: Run linked native allocation scenario performance gate
        run: cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench allocation_shape

      - name: Benchmark linked selector
        run: |
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 1 1024
          cargo bench --locked -p marlin-deck-runtime --features actor-runtime --bench single_vm_actor -- 64 1024
          cargo bench --locked -p marlin-agent-policy-routing-abi --features linked-selector --bench linked_selector

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        if: inputs.qualify_context_latency
        with:
          tool: just@1.56.0
      - name: Qualify full Context latency
        if: inputs.qualify_context_latency
        run: just context-latency-gate

      - name: Upload linked native benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linked-selector-criterion-${{ runner.os }}
          path: |
            target/criterion
            target/marlin/scenarios
            target/context-cohort.*
          if-no-files-found: warn
