name: REUSE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license:
    name: REUSE / licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install REUSE
        run: python -m pip install 'reuse[charset-normalizer]==6.3.0'
      - name: Check copyright and licensing
        run: reuse lint
