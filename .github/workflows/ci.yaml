name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: Rust / fmt / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  platform:
    name: Build and test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/platform.yaml
    with:
      os: ${{ matrix.os }}

  app-server:
    name: App Server / gRPC / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-server-grpc
      - name: Install Protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Test App Server over HTTP/2
        run: cargo test --locked -p marlin-agent-app-server --features grpc

  model:
    name: Quint / protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just@1.56.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: quint-npm-${{ runner.os }}-${{ runner.arch }}-0.33.0
      - name: Install Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.33.0
      - name: Run the maintained model gates
        run: just property-model-gate
