name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust / fmt / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  check:
    name: Rust / check / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: marlin-agent-core-check-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@0d92f7bee8c23b373ccd116be6f17701c4c4aac6
        with:
          release-root: ${{ runner.temp }}/gerbil

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

  lint:
    name: Rust / lint / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: marlin-agent-core-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@0d92f7bee8c23b373ccd116be6f17701c4c4aac6
        with:
          release-root: ${{ runner.temp }}/gerbil

      - name: Run Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust / test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: marlin-agent-core-test-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@0d92f7bee8c23b373ccd116be6f17701c4c4aac6
        with:
          release-root: ${{ runner.temp }}/gerbil

      - name: Run Rust tests
        run: >-
          cargo test --workspace --locked
          --exclude marlin-agent-harness --exclude marlin-gerbil-scheme --
          --skip storage_artifact_pointer_cas_lean_proof_builds

  gerbil:
    name: Scheme package and C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@0d92f7bee8c23b373ccd116be6f17701c4c4aac6
        with:
          release-root: ${{ runner.temp }}/gerbil

      - name: Check out AI Agentic Lab dependency tooling
        uses: actions/checkout@v6
        with:
          repository: tao3k/agentic-ai-lab
          ref: 75b04e07c6d5a2ff3fa73f2f47689a5947cd08d0
          path: .ci/agentic-ai-lab
          persist-credentials: false

      - name: Prepare the pinned Lab source
        working-directory: scheme
        run: gxpkg env gxi ../.ci/agentic-ai-lab/packages/automation/runtime-dependencies.ss --fetch-only

      - name: Prepare Lab's pinned dependencies
        working-directory: .ci/agentic-ai-lab
        env:
          GERBIL_PATH: ${{ github.workspace }}/scheme/.gerbil
        run: gxi packages/automation/runtime-dependencies.ss --fetch-only

      - name: Install the Scheme package dependency
        working-directory: scheme
        run: gxpkg deps --install

      - name: Build and test the Scheme package in process
        env:
          # Test fixtures import optional Lab constructors outside the runtime closure.
          GERBIL_LOADPATH: ${{ github.workspace }}/.ci/agentic-ai-lab:${{ github.workspace }}/scheme/.gerbil/lib
        working-directory: scheme
        run: gxpkg env cargo test --locked -p marlin-gerbil-scheme --test unit_test scheme_package::gerbil_builds_and_tests_the_marlin_package_in_process -- --ignored --exact --nocapture

      - name: Check Rust projections and linked policy routing
        run: |
          cargo test --locked -p marlin-gerbil-scheme --test unit_test
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector
