name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: Rust / fmt / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  platform:
    name: Build and test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/platform.yaml
    with:
      os: ${{ matrix.os }}

  app-server:
    name: App Server / gRPC / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-server-grpc
      - name: Install Protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Test the isolated Rust UI client
        shell: bash
        run: |
          cargo test --locked -p marlin-agent-ui --no-default-features --features grpc --test grpc_client
      - name: Test the generated Rust client from outside the workspace
        shell: bash
        run: |
          consumer=$(mktemp -d "$RUNNER_TEMP/marlin-grpc-consumer.XXXXXX")
          mkdir "$consumer/src"
          cp crates/marlin-agent-ui/tests/integration/grpc_client.rs "$consumer/src/lib.rs"
          cp Cargo.lock "$consumer/Cargo.lock"
          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "marlin-grpc-consumer"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          marlin-agent-ui = { path = "$GITHUB_WORKSPACE/crates/marlin-agent-ui", default-features = false, features = ["grpc"] }
          EOF
          # Cargo narrows the copied lock to the downstream graph using the
          # crates already downloaded by the locked workspace test.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo test --offline --manifest-path "$consumer/Cargo.toml"
          dependencies=$(cargo tree --offline --locked --manifest-path "$consumer/Cargo.toml" -e normal,build --prefix none --format '{p}')
          forbidden=$(awk '$1 ~ /^gerbil-scheme/ || ($1 ~ /^marlin-agent-/ && $1 != "marlin-agent-ui" && $1 != "marlin-agent-app-server")' <<< "$dependencies")
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Test App Server over HTTP/2
        run: cargo test --locked -p marlin-agent-app-server --features grpc

  model:
    name: Quint / protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just@1.56.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: quint-npm-${{ runner.os }}-${{ runner.arch }}-0.33.0
      - name: Install Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.33.0
      - name: Run the maintained model gates
        run: just property-model-gate
