name: Rust and Scheme platform

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Build the selected Scheme package
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          key: scheme-dependencies
      - uses: ./.github/actions/prepare-scheme
      - name: Archive this run's Scheme products
        id: artifact
        run: |
          tar -czf "$RUNNER_TEMP/package.tar.gz" scheme/.gerbil
          echo "name=marlin-scheme-${{ inputs.os }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/package.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  rust:
    name: Rust / ${{ matrix.gate }}
    needs: prepare
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(inputs.os == 'ubuntu-latest' && '["check","lint","test","tui"]' || '["test","tui"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ (matrix.gate == 'lint' || (matrix.gate == 'tui' && inputs.os == 'ubuntu-latest')) && 'clippy' || '' }}
      - uses: ./.github/actions/restore-scheme
        with:
          artifact: ${{ needs.prepare.outputs.artifact }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-${{ matrix.gate }}-${{ hashFiles('.github/actions/setup-scheme/action.yml', 'scheme/gerbil.pkg') }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        if: matrix.gate == 'tui'
        with:
          tool: just@1.56.0
      - name: Stage the linked TUI program
        if: matrix.gate == 'tui'
        run: just tui-program-stage
      - name: Run the Rust gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          # The Rust workspace document and contract APIs still consume Orgize directly.
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ matrix.gate != 'tui' && format('{0}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json', github.workspace) || '' }}
        run: |
          case "$GATE" in
            check) cargo check --workspace --exclude marlin-agent-tui --all-targets --locked ;;
            lint) cargo clippy --workspace --exclude marlin-agent-tui --all-targets --locked -- -D warnings ;;
            test)
              cargo test --workspace --locked \
                --exclude marlin-agent-harness --exclude marlin-gerbil-scheme \
                --exclude marlin-agent-tui --features marlin-agent-storage/turso \
                -- --skip storage_artifact_pointer_cas_lean_proof_builds
              ;;
            tui)
              if [[ "$RUNNER_OS" == Linux ]]; then
                cargo check --locked -p marlin-agent-tui --all-targets
                cargo clippy --locked -p marlin-agent-tui --all-targets -- -D warnings
              fi
              cargo test --locked -p marlin-agent-tui
              ;;
          esac

  scheme:
    name: Scheme package and C ABI
    if: inputs.os == 'ubuntu-latest'
    needs: prepare
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/restore-scheme
        with:
          artifact: ${{ needs.prepare.outputs.artifact }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: scheme-package-${{ hashFiles('.github/actions/setup-scheme/action.yml', 'scheme/gerbil.pkg') }}
      - name: Exercise the Scheme Context Org boundary from Rust
        run: >-
          cargo test --locked -p marlin-agent-context --features gerbil
          --test org_scheme_vm selected_lab_org_graph_preserves_source_and_utf8_byte_spans
          -- --ignored --exact --nocapture
      - name: Build and test the Scheme package in process
        working-directory: scheme
        env:
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ github.workspace }}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json
        run: |
          export GERBIL_LOADPATH="$GERBIL_PATH/pkg/github.com/tao3k/agentic-ai-lab:$GERBIL_LOADPATH"
          gxpkg env cargo test --locked -p marlin-gerbil-scheme --test unit_test scheme_package::gerbil_builds_and_tests_the_marlin_package_in_process -- --ignored --exact --nocapture
      - name: Check Rust projections and linked policy routing
        env:
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ github.workspace }}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json
        run: |
          cargo test --locked -p marlin-gerbil-scheme --test unit_test
          cargo test --locked -p marlin-agent-policy-routing-abi --features linked-selector
      - name: Install Worktrunk for the worktree acceptance
        shell: bash
        run: |
          archive=worktrunk-x86_64-unknown-linux-musl.tar.xz
          url="https://github.com/max-sixty/worktrunk/releases/download/v0.58.0/$archive"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output "$archive" "$url"
          printf '%s  %s\n' d1feb2c231e10030c5301ffdd539a48f37ebfec50dea6ef1e1078c87e95beeec "$archive" | sha256sum --check
          tar -xJf "$archive" worktrunk-x86_64-unknown-linux-musl/wt
          echo "$RUNNER_TEMP/worktrunk-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify Scheme working-copy selection and Git receipts
        env:
          ORGIZE_GERBIL_PROGRAM_MANIFEST: ${{ github.workspace }}/scheme/.gerbil/pkg/github.com/tao3k/orgize/target/gerbil-parser/program.json
        run: >-
          cargo test --locked -p marlin-gerbil-scheme --test unit_test
          working_copy_policy::scheme_selects_the_provider_for_a_real_git_worktree
          -- --ignored --exact --nocapture

  linked-aot:
    name: Linked AOT
    needs: prepare
    uses: ./.github/workflows/linked-scheme-aot-gate.yaml
    with:
      runner: ${{ toJSON(inputs.os) }}
      artifact: ${{ needs.prepare.outputs.artifact }}
