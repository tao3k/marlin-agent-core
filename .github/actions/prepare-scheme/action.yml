name: Build the Scheme package
description: Use the Gerbil package manager and Builder on the selected platform.
inputs:
  trace-dependency-crash:
    description: Retain the failing Gerbil indexer's source order and inspect its crash dump on hosted Ubuntu.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-scheme
      id: sdk
    - name: Restore installed Scheme dependencies
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: scheme/.gerbil
        key: scheme-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.toolchain }}-${{ hashFiles('scheme/gerbil.pkg', 'Cargo.lock', '.github/actions/prepare-scheme/action.yml') }}
    - name: Install declared Scheme dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      env:
        GERBIL_PATH: ${{ github.workspace }}/scheme/.gerbil
        TRACE_DEPENDENCY_CRASH: ${{ inputs.trace-dependency-crash }}
      run: |
        # The pinned SDK checks out the requested revision before fetching it.
        # Orgize belongs to Lab's Scheme dependency graph, never Cargo's graph.
        orgize_repo=github.com/tao3k/orgize
        orgize_checkout="$GERBIL_PATH/pkg/$orgize_repo"
        lab_repo=github.com/tao3k/agentic-ai-lab
        lab_revision=$(sed -nE 's/.*"github\.com\/tao3k\/agentic-ai-lab@([0-9a-f]{40})".*/\1/p' scheme/gerbil.pkg)
        [[ "$lab_revision" =~ ^[0-9a-f]{40}$ ]]
        seed_revision() {
          local repo=$1 revision=$2 checkout="$GERBIL_PATH/pkg/$1"
          git init --quiet --initial-branch=main "$checkout"
          git -C "$checkout" remote add origin "https://$repo.git"
          git -C "$checkout" fetch --quiet --no-tags origin "$revision"
          git -C "$checkout" cat-file -e "$revision^{tree}"
          # Let the package manager register its own revision metadata.
          (
            cd scheme
            GERBIL_PACKAGE_REVISION="$repo@$revision" gxi -e '
              (import :gerbil/tools/gxpkg)
              (pkg-update (getenv "GERBIL_PACKAGE_REVISION"))'
          )
        }
        seed_revision "$lab_repo" "$lab_revision"
        git -C "$GERBIL_PATH/pkg/$lab_repo" submodule update --init --checkout core
        orgize_revision=$(git -C "$GERBIL_PATH/pkg/$lab_repo" show "$lab_revision:gerbil.pkg" |
          sed -nE 's/.*"github\.com\/tao3k\/orgize@([0-9a-f]{40})".*/\1/p')
        [[ "$orgize_revision" =~ ^[0-9a-f]{40}$ ]]
        seed_revision "$orgize_repo" "$orgize_revision"
        # Orgize's C bindings stage the parser with this build-only package.
        gerbil pkg install github.com/tao3k/gerbil-scheme-rust@dfe8b62b5dc64de88f8d70a77059a1741218ef80
        if [[ "$TRACE_DEPENDENCY_CRASH" == true && "$RUNNER_OS" == Linux ]]; then
          command -v gdb >/dev/null || sudo apt-get install -y gdb
          crash_dir=$(mktemp -d "$RUNNER_TEMP/marlin-gerbil-crash.XXXXXX")
          core_pattern=$(sysctl -n kernel.core_pattern)
          trap 'sudo sysctl -q -w "kernel.core_pattern=$core_pattern"' EXIT
          sudo sysctl -q -w "kernel.core_pattern=$crash_dir/core.%e.%p"
          ulimit -c unlimited
          cat > "$crash_dir/grammar-global.gdb" <<'GDB'
        python
        import gdb
        import re
        import subprocess

        try:
            pc = int(gdb.parse_and_eval("$pc"))
            module = gdb.solib_name(pc) or ""
            if re.search(r"orgize/.*/(?:grammar|expectation-grammar)~0[.]o1$", module):
                # On this x86-64 crash, a RIP-relative load fetches the global
                # cell immediately before dereferencing its unbound value.
                assembly = gdb.execute("disassemble /r $pc-10,$pc", to_string=True)
                slot = re.search(r"# (0x[0-9a-f]+) <___glotbl\+(\d+)>", assembly)
                if slot is None:
                    raise ValueError("fault does not match the observed global load")
                slot_address, byte_offset = int(slot[1], 16), int(slot[2])
                pointer_size = gdb.lookup_type("void").pointer().sizeof
                if byte_offset % pointer_size:
                    raise ValueError("unaligned global table slot")
                symbols = subprocess.check_output(["nm", "--defined-only", module], text=True)
                offsets = {name: int(address, 16) for address, name in
                           re.findall(r"^([0-9a-f]+) \w (___glotbl|___glo_names)$", symbols, re.M)}
                name_slot = slot_address + offsets["___glo_names"] - offsets["___glotbl"]
                name = gdb.parse_and_eval("*(char **)" + hex(name_slot)).string()
                value = gdb.parse_and_eval("**(long **)" + hex(slot_address))
                print(f"Orgize grammar fault global {name!r}, slot {byte_offset // pointer_size}, value {int(value)}")
        except Exception as failure:
            print(f"Orgize grammar fault global unavailable: {failure}")
        end
        GDB
          export MARLIN_TRACE_GXTAGS="$(command -v gxtags)"
          export MARLIN_TRACE_DIR="$crash_dir"
          mkdir "$crash_dir/bin"
          cat > "$crash_dir/bin/gxtags" <<'TRACE'
        #!/usr/bin/env bash
        previous=
        for argument in "$@"; do
          if [[ "$previous" == --source-list ]]; then
            cp -- "$argument" "$MARLIN_TRACE_DIR/$BASHPID.inputs" || exit
            break
          fi
          previous=$argument
        done
        exec "$MARLIN_TRACE_GXTAGS" "$@"
        TRACE
          chmod +x "$crash_dir/bin/gxtags"
          export PATH="$crash_dir/bin:$PATH"
        fi
        # gxpkg captures gxtags stdout. Send uncaught Gambit errors to stderr.
        (cd scheme && GAMBOPT="${GAMBOPT:+$GAMBOPT,}debug=q2+" gerbil deps --install) || {
          status=$?
          if [[ -n "${crash_dir:-}" ]]; then
            orgize_crashed=false
            for dump in "$crash_dir"/core.gxtags.* "$crash_dir"/core.gerbil.*; do
              [[ -f "$dump" ]] || continue
              tool=${dump##*/core.}
              tool=${tool%%.*}
              worker_pid=${dump##*.}
              executable=$(command -v "$tool")
              if [[ "$tool" == gxtags ]]; then
                executable=$MARLIN_TRACE_GXTAGS
              fi
              worker_inputs="$crash_dir/$worker_pid.inputs"
              if [[ -s "$worker_inputs" ]]; then
                printf 'gxtags worker %s ordered source list\n' "$worker_pid"
                cat -- "$worker_inputs"
                printf '\n'
              fi
              backtrace="$dump.txt"
              gdb --batch --nx -iex 'set auto-load off' \
                -ex 'set print frame-arguments none' -ex 'thread apply all bt' \
                -ex 'info registers' -ex 'disassemble /r $pc-32,$pc+48' \
                -x "$crash_dir/grammar-global.gdb" \
                "$executable" "$dump" 2>&1 | tee "$backtrace" || true
              if grep -Eq 'orgize/[^ ]*/(grammar|expectation-grammar)~0[.]o1' "$backtrace"; then
                orgize_crashed=true
              fi
            done
            if [[ "$orgize_crashed" == true ]]; then
              # Compare ordinary imports and isolated source indexing against
              # the same compiled dependencies as the full package index.
              ulimit -c 0
              export GAMBOPT="${GAMBOPT:+$GAMBOPT,}debug=q2+"
              # Reuse gxtags' actual worker input after the original workers exit.
              for dump in "$crash_dir"/core.gxtags.* "$crash_dir"/core.gerbil.*; do
                [[ -f "$dump" && "$dump" != *.txt ]] || continue
                worker_pid=${dump##*.}
                worker_inputs="$crash_dir/$worker_pid.inputs"
                [[ -s "$worker_inputs" ]] || continue
                # Isolate the Orgize portion while preserving the worker's order.
                WORKER_INPUTS="$worker_inputs" gxi -e '
                  (let* ((paths (call-with-input-file (getenv "WORKER_INPUTS") read))
                         (prefix "github.com/tao3k/orgize/")
                         (length-prefix (string-length prefix))
                         (orgize (filter (lambda (path)
                                          (and (>= (string-length path) length-prefix)
                                               (string=? prefix (substring path 0 length-prefix))))
                                        paths)))
                    (unless (pair? orgize) (error "worker did not index Orgize"))
                    (write orgize)
                    (newline))' \
                  > "$worker_inputs.orgize"
                for scope in orgize full; do
                  inputs=$worker_inputs
                  if [[ "$scope" == orgize ]]; then
                    inputs="$worker_inputs.orgize"
                  fi
                  replay_status=0
                  (cd "$GERBIL_PATH/pkg" && timeout 120s "$MARLIN_TRACE_GXTAGS" \
                    --global-env --jobs 1 --source-list "$inputs" \
                    -o "$crash_dir/$worker_pid.$scope.tags" > "$crash_dir/$worker_pid.$scope.log" 2>&1) || replay_status=$?
                  printf 'gxtags worker %s %s ordered replay status %s\n' "$worker_pid" "$scope" "$replay_status"
                  tail -n 12 "$crash_dir/$worker_pid.$scope.log"
                done
              done
              for module in org-parser/grammar org-contract/expectation-grammar; do
                import_status=0
                tag_status=0
                binding=org-mode-language-grammar
                if [[ "$module" == org-contract/expectation-grammar ]]; then
                  binding=org-expectation-language-grammar
                fi
                (cd "$GERBIL_PATH/pkg" && timeout 120s gxi -e \
                  "(import :orgize/languages/org/modules/$module)
                   (unless $binding (error \"missing Org grammar\"))") || import_status=$?
                (cd "$GERBIL_PATH/pkg" && timeout 120s gxtags --global-env --jobs 1 \
                  -o "$crash_dir/${module##*/}.tags" \
                  "$orgize_checkout/languages/org/modules/$module.ss") || tag_status=$?
                printf 'Orgize %s direct import status %s, single-file index status %s\n' \
                  "$module" "$import_status" "$tag_status"
              done
            fi
          fi
          exit "$status"
        }
        test "$(git -C "$orgize_checkout" rev-parse HEAD)" = "$orgize_revision"
        test "$(git -C "$GERBIL_PATH/pkg/$lab_repo" rev-parse HEAD)" = "$lab_revision"
    - name: Save installed Scheme dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: scheme/.gerbil
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - name: Build the selected Scheme package
      shell: bash
      working-directory: scheme
      run: gerbil build
