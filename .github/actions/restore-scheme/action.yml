name: Restore the Marlin Scheme package
description: Activate the same SDK and restore the current run's Scheme package.
inputs:
  artifact:
    description: Scheme package artifact produced by the current workflow.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-scheme
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/marlin-scheme
    - name: Restore the Scheme build
      shell: bash
      run: |
        tar -xzf "$RUNNER_TEMP/marlin-scheme/package.tar.gz" -C "$GITHUB_WORKSPACE"
    - name: Export Scheme package paths
      shell: bash
      run: |
        prefix="$GITHUB_WORKSPACE/scheme/.gerbil"
        test -s "$prefix/lib/marlin-agent-core/init.ssi"
        {
          echo "GERBIL_PATH=$prefix"
          echo "GERBIL_LOADPATH=$prefix/lib"
        } >> "$GITHUB_ENV"
