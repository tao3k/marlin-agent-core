orgize = { git = "https://github.com/tao3k/orgize", rev = "7a54cc75de8cf9a9986be70bac38be14010141bd" }
parking_lot = "0.12.5"
proptest = "=1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
